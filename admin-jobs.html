<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Jobs - CareerConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <h2>CareerConnect Admin</h2>
        <a href="admin-dashboard.html">Admin Dashboard</a>
        <a href="jobs.html">View Jobs</a>
        <a href="dashboard.html">Student Dashboard</a>
    </nav>

    <section>
        <h1>Add a New Job or Internship</h1>
        <p>Enter the opportunity details below.</p>

        <form id="jobForm">

            <label for="jobTitle">Job Title</label><br>
            <input type="text" id="jobTitle" name="jobTitle"
                   placeholder="e.g. Software Developer Intern" required>
            <br><br>

            <label for="company">Company Name</label><br>
            <input type="text" id="company" name="company"
                   placeholder="Enter company name" required>
            <br><br>

            <label for="location">Location</label><br>
            <input type="text" id="location" name="location"
                   placeholder="e.g. Noida" required>
            <br><br>

            <label for="jobType">Job Type</label><br>
            <select id="jobType" name="jobType" required>
                <option value="">Select job type</option>
                <option value="Internship">Internship</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
            </select>
            <br><br>

            <label for="stipend">Salary / Stipend</label><br>
            <input type="text" id="stipend" name="stipend"
                   placeholder="e.g. ₹15,000 per month" required>
            <br><br>

            <label for="duration">Duration</label><br>
            <input type="text" id="duration" name="duration"
                   placeholder="e.g. 3 months" required>
            <br><br>

            <label for="deadline">Application Deadline</label><br>
            <input type="date" id="deadline" name="deadline" required>
            <br><br>

            <label for="description">Job Description</label><br>
            <textarea id="description" name="description" rows="5"
                      placeholder="Describe the role and responsibilities"
                      required></textarea>
            <br><br>

            <button type="submit">Add Job</button>
            <button type="reset">Clear Form</button>

        </form>
    </section>

    <script src="js/admin-jobs.js"></script>
</body>
</html>
