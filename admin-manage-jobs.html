<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Jobs - CareerConnect Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <h2>CareerConnect Admin</h2>
        <a href="admin-dashboard.html">Admin Dashboard</a>
        <a href="admin-jobs.html">Add Job</a>
        <a href="admin-applications.html">Manage Applications</a>
        <a href="dashboard.html">Student Dashboard</a>
    </nav>

    <section>
        <h1>Manage Jobs & Internships</h1>
<div class="card" id="editJobForm" style="display: none;">
    <h2>Edit Job Details</h2>

    <label for="editTitle">Job Title</label><br>
    <input type="text" id="editTitle" required>
    <br><br>

    <label for="editCompany">Company Name</label><br>
    <input type="text" id="editCompany" required>
    <br><br>

    <label for="editLocation">Location</label><br>
    <input type="text" id="editLocation" required>
    <br><br>

    <label for="editType">Job Type</label><br>
    <select id="editType">
        <option value="Internship">Internship</option>
        <option value="Full-time">Full-time</option>
        <option value="Part-time">Part-time</option>
    </select>
    <br><br>

    <label for="editStipend">Salary / Stipend</label><br>
    <input type="text" id="editStipend" required>
    <br><br>

    <button type="button" onclick="saveJobChanges()">Save Changes</button>
    <button type="button" onclick="cancelEdit()">Cancel</button>
</div>
        <p>View and manage the available opportunities.</p>

        <button onclick="window.location.href='admin-jobs.html'">
            + Add New Job
        </button>

       </section>
    <script src="js/jobs-storage.js"></script>
    <script src="js/admin-manage-jobs.js"></script>
</body>
</html>
